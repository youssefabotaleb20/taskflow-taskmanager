# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
# The database is MongoDB Atlas (free M0 cluster); paste its connection string as MONGODB_URI.
services:
  - type: web
    name: taskflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://taskflow-web.onrender.com

  - type: web
    name: taskflow-web
    runtime: static
    buildCommand: npm ci && npm run build -w web
    staticPublishPath: ./web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://taskflow-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
